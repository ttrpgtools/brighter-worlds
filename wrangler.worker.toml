# Prepared Worker target. Existing Pages deployments do not consume this file.
name = "brighter-worlds"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-06-13"
workers_dev = false
preview_urls = false

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"
run_worker_first = true

[[services]]
binding = "AUTH"
service = "ankh"
entrypoint = "AuthService"
[services.props]
appId = "bwo"

[[services]]
binding = "STORE"
service = "aegis"
entrypoint = "Aegis"
[services.props]
appId = "bwo"

[vars]
PUBLIC_ANKH = "https://ankh.ttrpg.tools"

# Domain routes are intentionally absent. The dev-first cutover requires a reviewed
# routing/rollback plan; this file must not detach either domain from Pages.
